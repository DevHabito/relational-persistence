name: RP-E011-D02 Original JSSPP CERIT Data Source Check

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rp-e011-d02.yml
      - experiments/rp_e011_jsspp_source.py
      - tests/test_rp_e011_jsspp_source.py
      - docs/preregistration/RP-E011-D02.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rp-e011-d02-${{ github.ref }}
  cancel-in-progress: false

jobs:
  first_original_source:
    name: First original academic CERIT extended SWF source eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixed research dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run synthetic-only source anomaly tests before any new data
        run: python -m pytest -q tests/test_rp_e011_jsspp_source.py
      - name: Obtain FIRST exact JSSPP source and check fields — no prediction
        run: |
          python -m experiments.rp_e011_jsspp_source \
            --output rp-e011-d02-original/
      - name: Preserve first provider file and audit including BLOCKED/REJECTED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rp-e011-d02-original-provider-source-and-audit
          path: rp-e011-d02-original/
          if-no-files-found: warn
          retention-days: 90
      - name: Archive exact first-run source metadata (not bulk third-party rows)
        if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          original="rp-e011-d02-original/RP-E011-D02.json"
          target="docs/results/RP-E011-D02-first-run"
          if test -e "$target"; then
            echo "Original first-run record exists; no overwrite allowed."
            exit 0
          fi
          if ! test -f "$original"; then
            echo "First original source audit missing, cannot invent data." >&2
            exit 1
          fi
          mkdir -p "$target"
          cp "$original" "$target/audit.json"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("docs/results/RP-E011-D02-first-run")
          record=json.loads((root/"audit.json").read_text(encoding="utf-8"))
          file_hash=hashlib.sha256((root/"audit.json").read_bytes()).hexdigest()
          metadata={
              "protocol":"RP-E011-D02",
              "original_run_id":"${{ github.run_id }}",
              "original_source_code_commit":"${{ github.sha }}",
              "first_observed_verdict":record["decision"],
              "first_observed_audit_sha256":file_hash,
              "original_external_data_copied_into_git":False,
              "source_bytes_prehash_registered":False,
              "forecast_computed":False,
              "supersedes_RP_E011_D01":False,
          }
          (root/"archive-index.json").write_text(
              json.dumps(metadata,indent=2,sort_keys=True)+"\n",
              encoding="utf-8"
          )
          PY
          git add "$target"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "data(provenance): preserve first distinct JSSPP original source verdict"
          git push origin HEAD:main
      - name: Keep valid schema rejection separate from causal/predictive failures
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          path=Path("rp-e011-d02-original/RP-E011-D02.json")
          if not path.is_file():
              raise SystemExit("SOURCE_ACCESS_BLOCKED: no first original audit")
          record=json.loads(path.read_text())
          print("RP_E011_D02_FROZEN_SOURCE_DECISION",record["decision"])
          assert record["retrospective_forecast_evaluated"] is False
          if record["decision"]!="DATASET_SCHEMA_VERIFIED":
              raise SystemExit(record["decision"])
          PY
