name: RP-E008-S01 Frozen Independent Discrete-Event Transfer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rp-e008-s01.yml
      - experiments/rp_e008_independent_des.py
      - tests/test_rp_e008_independent_des.py
      - docs/preregistration/RP-E008-S01.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rp-e008-s01-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original_simulation:
    name: First 72-case exact model transfer test
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research tests
        run: python -m pip install -e '.[dev]'
      - name: Check independent engine invariants and frozen gates first
        run: python -m pytest -q tests/test_rp_e008_independent_des.py
      - name: Execute FIRST full preregistered 72-trial in-silico transfer
        run: |
          python -m experiments.rp_e008_independent_des \
            --output rp-e008-first-run/
      - name: Preserve all original simulator input and event bytes even after error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rp-e008-s01-original
          path: rp-e008-first-run/
          if-no-files-found: warn
          retention-days: 90
      - name: Immutable first-main-run archival, including a negative or STOP
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          destination="docs/results/RP-E008-S01-first-run"
          if test -e "$destination"; then
            echo "Permanent first-run record exists: will not overwrite it."
            exit 0
          fi
          if ! test -e rp-e008-first-run/summary.json && ! test -e rp-e008-first-run/error.json; then
            echo "No simulator record for reliable first-run archival." >&2
            exit 1
          fi
          mkdir -p "$destination"
          cp -a rp-e008-first-run/. "$destination/"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("docs/results/RP-E008-S01-first-run")
          originals = {
              str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in sorted(root.rglob("*")) if p.is_file()
          }
          observed = root / "summary.json"
          if observed.is_file():
              decision = json.loads(observed.read_text())["decision"]
          else:
              decision = "STOP_SIMULATOR_INVARIANT"
          metadata = {
              "protocol": "RP-E008-S01",
              "source_commit": "${{ github.sha }}",
              "github_run_id": "${{ github.run_id }}",
              "decision": decision,
              "original_data_sha256": originals,
              "simulator_study_not_physical": True,
              "archive_policy": "single first-run immutable original event bytes",
          }
          (root / "archive-index.json").write_text(
              json.dumps(metadata, sort_keys=True, indent=2) + "\n"
          )
          print("ARCHIVED_FIRST_RUN_SOURCE_FILES", len(originals))
          PY
          git add "$destination"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "data(research): archive RP-E008 first simulator transfer result even if negative"
          git push origin HEAD:main
      - name: Only stop for failed simulation invariants, not negative gain
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path("rp-e008-first-run/summary.json")
          if not p.is_file():
              raise SystemExit("STOP_SIMULATOR_INVARIANT: no first-run summary")
          result = json.loads(p.read_text())
          verdict = result["decision"]
          print("REGISTERED_FIRST_RP_E008_VERDICT", verdict)
          if verdict == "STOP_SIMULATOR_INVARIANT":
              raise SystemExit(verdict)
          assert verdict in ("PASS_SIMULATED_TRANSFER", "NO_REGISTERED_SIMULATED_TRANSFER")
          PY
