name: RP-E011-D01 Official Polaris Dataset Source Check

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rp-e011-d01.yml
      - experiments/rp_e011_alcf_source.py
      - tests/test_rp_e011_alcf_source.py
      - docs/preregistration/RP-E011-D01.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rp-e011-d01-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original_source:
    name: Original official ALFC Polaris 2022 no-prediction schema audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen source regression dependencies
        run: python -m pip install -e '.[dev]'
      - name: Audit source resolver and negative cases before official download
        run: python -m pytest -q tests/test_rp_e011_alcf_source.py
      - name: FIRST official data retrieval and source-only eligibility, no forecast
        run: |
          python -m experiments.rp_e011_alcf_source \
            --output rp-e011-d01-original/
      - name: Retain first original provider payload and negative/BLOCKED source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rp-e011-d01-first-source-audit
          path: rp-e011-d01-original/
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve first-run metadata and negative result even when source blocked
        if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          destination="docs/results/RP-E011-D01-first-run"
          if test -e "$destination"; then
            echo "The first original record already exists; refusing replacement."
            exit 0
          fi
          if ! test -f rp-e011-d01-original/RP-E011-D01.json; then
            echo "Original source audit JSON absent; refusing invented provenance." >&2
            exit 1
          fi
          mkdir -p "$destination"
          cp rp-e011-d01-original/RP-E011-D01.json "$destination/audit.json"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("docs/results/RP-E011-D01-first-run")
          saved=root/"audit.json"
          audit=json.loads(saved.read_text(encoding="utf-8"))
          index={
              "protocol":"RP-E011-D01",
              "original_first_run_id":"${{ github.run_id }}",
              "source_code_sha":"${{ github.sha }}",
              "registered_first_verdict":audit["decision"],
              "original_report_sha256":hashlib.sha256(saved.read_bytes()).hexdigest(),
              "downloaded_official_original_stored_in_git":False,
              "source_version_pinned_before_first_run":False,
              "new_prediction_or_law_claim":False,
              "integrity_policy":"archive first observed attempt even on rejection or blocked access",
          }
          (root/"archive-index.json").write_text(
              json.dumps(index,indent=2,sort_keys=True)+"\n",encoding="utf-8"
          )
          PY
          git add "$destination"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "data(provenance): archive first official RP-E011 source attempt including BLOCKED"
          git push origin HEAD:main
      - name: Distinguish source rejection from predictive failure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          file=Path("rp-e011-d01-original/RP-E011-D01.json")
          if not file.is_file():
              raise SystemExit("SOURCE_ACCESS_BLOCKED: missing original source audit")
          audit=json.loads(file.read_text())
          verdict=audit["decision"]
          print("FIRST_RP_E011_D01_SOURCE_GATE",verdict)
          assert audit["queue_prediction_scored"] is False
          if verdict != "DATASET_SCHEMA_VERIFIED":
              raise SystemExit(verdict)
          PY
