name: RP-E010-P01 Frozen HPC Observational Holdout

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rp-e010-p01.yml
      - experiments/rp_e010_observational_forecast.py
      - tests/test_rp_e010_observational_forecast.py
      - docs/preregistration/RP-E010-P01.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rp-e010-p01-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observational_holdout:
    name: Original frozen HPC holdout with dual event reconstruction
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen research dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify source and adversarial non-leakage gates BEFORE prediction
        run: |
          python -m pytest -q \
            tests/test_rp_e010_source_audit.py \
            tests/test_rp_e010_first_source_archive.py \
            tests/test_rp_e010_observational_forecast.py
      - name: Execute FIRST real external HPC2N wait-time prediction and preserve NO_GAIN
        run: |
          python -m experiments.rp_e010_observational_forecast \
            --output rp-e010-p01-original
      - name: Preserve all first-run heldout/diagnostic job predictions with hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rp-e010-p01-original-predictions-and-outcome
          path: rp-e010-p01-original/
          if-no-files-found: warn
          retention-days: 90
      - name: Archive FIRST permanent outcome and original per-job artifact digests
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          destination="docs/results/RP-E010-P01-first-run"
          if test -e "$destination"; then
            echo "Original first-run archival record already exists; never replace."
            exit 0
          fi
          if ! test -f rp-e010-p01-original/RP-E010-P01-first-evaluation.json; then
            echo "First-run original score absent: cannot archive purported result." >&2
            exit 1
          fi
          mkdir -p "$destination"
          cp rp-e010-p01-original/RP-E010-P01-first-evaluation.json "$destination/evaluation.json"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          first=Path("rp-e010-p01-original")
          target=Path("docs/results/RP-E010-P01-first-run")
          evidence=target/"evaluation.json"
          outcome=json.loads(evidence.read_text())
          original_files={
              p.name:{
                  "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                  "bytes": p.stat().st_size,
                  "retention": "original GitHub Actions artifact; not copied into Git"
              }
              for p in first.glob("*original-predictions.jsonl") if p.is_file()
          }
          recorded={
              "protocol": "RP-E010-P01",
              "original_github_run_id": "${{ github.run_id }}",
              "original_source_commit": "${{ github.sha }}",
              "original_verdict": outcome["decision"],
              "archived_evaluation_sha256": hashlib.sha256(evidence.read_bytes()).hexdigest(),
              "original_per_job_files": original_files,
              "source_corpus_copied_to_git": False,
              "predictor_validated_as_physical_law": False,
              "archive_policy": "first-run even when negative or STOP; no hidden rerun",
          }
          (target/"archive-index.json").write_text(
              json.dumps(recorded, sort_keys=True, indent=2)+"\n"
          )
          PY
          git add "$destination"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "data(research): preserve original external HPC holdout including negative/STOP"
          git push origin HEAD:main
      - name: Reject damaged evidence but never reject a valid negative observation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          file=Path("rp-e010-p01-original/RP-E010-P01-first-evaluation.json")
          if not file.is_file():
              raise SystemExit("STOP_OBSERVATIONAL_AUDIT: missing original result")
          result=json.loads(file.read_text())
          verdict=result["decision"]
          print("REGISTERED_FIRST_RP_E010_P01_DECISION",verdict)
          if verdict=="STOP_OBSERVATIONAL_AUDIT":
              raise SystemExit(verdict)
          assert verdict in (
              "NO_REGISTERED_OBSERVATIONAL_GAIN",
              "PASS_OBSERVATIONAL_INCREMENT",
          )
          PY
