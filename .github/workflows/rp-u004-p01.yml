name: RP-U004-P01 First Matched-Degree Equal-Information Benchmark

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rp-u004-p01.yml
      - experiments/rp_u004_equal_information.py
      - tests/test_rp_u004_equal_information.py

permissions:
  contents: read

concurrency:
  group: rp-u004-p01-first-original
  cancel-in-progress: false

jobs:
  first_matched_degree_finite_repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse replacement of a first original result
        run: |
          set -euo pipefail
          if test -e docs/results/RP-U004-P01-first-run; then
            echo 'Original RP-U004 archive already present: refusing another first run'
            exit 1
          fi
          test -f docs/preregistration/RP-U004-P01.md
      - name: Install only declared dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run source-family and stopping-gate tests before outcome scoring
        run: python -m pytest -q tests/test_rp_u004_equal_information.py
      - name: Execute the first original frozen benchmark, preserving all verdicts
        run: |
          python -m experiments.rp_u004_equal_information --output rp-u004-original/audit.json
      - name: Keep original raw report independently accessible as an Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rp-u004-p01-first-original-finite-report
          path: rp-u004-original/audit.json
          retention-days: 90
          if-no-files-found: warn
      - name: Freeze first-run bytes, SHA-256 and positive or negative verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          src=rp-u004-original/audit.json
          dir=docs/results/RP-U004-P01-first-run
          if test -e "$dir"; then
            echo 'Refusing to overwrite frozen original results'
            exit 1
          fi
          if ! test -f "$src"; then
            echo 'Original output was never generated; cannot invent a result'
            exit 1
          fi
          mkdir -p "$dir"
          cp "$src" "$dir/audit.json"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root=Path("docs/results/RP-U004-P01-first-run")
          content=(root/"audit.json").read_bytes()
          report=json.loads(content)
          index={
            "protocol":"RP-U004-P01",
            "protocol_freeze_commit":"186d6fc5d8cc6451fca63abb5f6ef4f2029a3d7b",
            "first_code_commit":"${{ github.sha }}",
            "first_run_id":"${{ github.run_id }}",
            "first_verdict":report["verdict"],
            "original_audit_sha256":hashlib.sha256(content).hexdigest(),
            "accepted_family_sha256":report["family"].get("accepted_labeled_family_sha256"),
            "selected_family_sha256":report["family"].get("selected_labeled_family_sha256"),
            "case_trace_sha256":report.get("case_trace_sha256"),
            "physical_data_rows":0,
            "new_lean_theorem_claimed":False,
            "new_physical_law_claimed":False,
          }
          (root/"archive-index.json").write_text(
            json.dumps(index,sort_keys=True,indent=2)+"\n",encoding="utf-8"
          )
          PY
          git add "$dir"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "data(provenance): freeze FIRST U004 matched-degree benchmark including adverse verdict"
          git push origin HEAD:main
