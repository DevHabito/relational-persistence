name: NEU-01-G02 Original EEG Two-State Signal Quality Census

on:
  push:
    branches:
      - research/neu-01-g02-signal-qc-20261109
    paths:
      - .github/workflows/neu01-g02-qc.yml

permissions:
  contents: read

concurrency:
  group: neu01-g02-first-original-signal-qc
  cancel-in-progress: false

jobs:
  first_original_signal_quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing pinned research dependencies
        run: python -m pip install -e '.[dev]'
      - name: Synthetic preflight MUST pass before genuine EEG samples are read
        run: python -m pytest -q tests/test_neu01_g02_original_signal_qc.py
      - name: Run exact original EEG sample and 10-second-channel-epoch QC
        run: python -m experiments.neu01_g02_original_signal_qc
      - name: Pin checksum of aggregate first-run signal QC, never upload EEG samples
        run: |
          test -f docs/results/NEU-01-G02-first-run/audit.json
          sha256sum docs/results/NEU-01-G02-first-run/audit.json
      - name: Preserve only aggregate task-level source QC and no original binary samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neu01-g02-first-source-qc-aggregates-only
          path: docs/results/NEU-01-G02-first-run/audit.json
          if-no-files-found: warn
          retention-days: 90
