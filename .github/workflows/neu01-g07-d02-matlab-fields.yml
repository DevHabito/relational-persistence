name: NEU-01-G07-D02 Retrospective MATLAB Top-Level Fields

on:
  push:
    branches:
      - audit/neu01-g07-d02-matlab-field-layout-20261112
    paths:
      - .github/workflows/neu01-g07-d02-matlab-fields.yml
      - experiments/neu01_g07_d02_mat_fields.py
      - tests/test_neu01_g07_d02_mat_fields.py

permissions:
  contents: read

concurrency:
  group: neu01-g07-d02-first-original-field-audit
  cancel-in-progress: false

jobs:
  first_original_matlab_field_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout full frozen chronology
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify post-result separate protocol existed first
        run: |
          git merge-base --is-ancestor 7bc2b1e73032a290748fdb38326974771a6f8244 "$GITHUB_SHA"
          test -f docs/protocols/NEU-01-G07-D02-MATLAB-FIELD-INVENTORY-2026-11-12.md
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and declared research dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run synthetic G07-D02 negative controls before source access
        run: python -m pytest -q tests/test_neu01_g07_d02_mat_fields.py
      - name: Reauthenticate one derivative and list safe MATLAB field metadata
        run: python -m experiments.neu01_g07_d02_mat_fields
      - name: Hash first original aggregate only
        if: always()
        run: |
          if [ -f docs/results/NEU-01-G07-D02-first-run/audit.json ]; then
            sha256sum docs/results/NEU-01-G07-D02-first-run/audit.json
          fi
      - name: Archive only metadata, never original EEG data or history text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neu01-g07-d02-matlab-metadata-only
          path: docs/results/NEU-01-G07-D02-first-run/audit.json
          if-no-files-found: warn
          retention-days: 90
