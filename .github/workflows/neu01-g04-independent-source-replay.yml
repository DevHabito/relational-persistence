name: NEU-01-G04 Independent G03 Source Replay
on:
  push:
    branches:
      - research/neu01-g04-independent-source-replay-20261112
    paths:
      - .github/workflows/neu01-g04-independent-source-replay.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neu01-g04-original-source-replay
  cancel-in-progress: false

jobs:
  independent_original_recount:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout chronology and archived G03 source oracle
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen protocol commit is ancestor
        run: |
          git merge-base --is-ancestor 6449070c5b95e1d4bbddd2243549593d4ed85f46 "$GITHUB_SHA"
          test -f docs/protocols/NEU-01-G04-P01-INDEPENDENT-REPLAY-2026-11-12.md
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic and corruption gates run before all original access
        run: python -m pytest -q tests/test_neu01_g04_independent_replay.py
      - name: Reacquire and independently decode six exact original records
        run: python -m experiments.neu01_g04_independent_replay
      - name: Hash aggregate-only G04 record
        if: always()
        run: |
          if [ -f docs/results/NEU-01-G04-P01-first-run/audit.json ]; then
            sha256sum docs/results/NEU-01-G04-P01-first-run/audit.json
          fi
      - name: Preserve only aggregate counts, never EEG samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neu01-g04-independent-replay-aggregates-only
          path: docs/results/NEU-01-G04-P01-first-run/audit.json
          if-no-files-found: warn
          retention-days: 90
