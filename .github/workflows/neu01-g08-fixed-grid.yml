name: NEU-01-G08 Fixed Original-Derivative Channel/Time Grid

on:
  push:
    branches:
      - research/neu01-g08-single-pair-grid-20261112
    paths:
      - .github/workflows/neu01-g08-fixed-grid.yml
      - experiments/neu01_g08_fixed_pair.py
      - tests/test_neu01_g08_fixed_pair.py

permissions:
  contents: read

concurrency:
  group: neu01-g08-first-one-pair-grid
  cancel-in-progress: false

jobs:
  original_single_pair_grid:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout frozen chronology and exact old source archives
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify protocol-only ancestry before code
        run: |
          git merge-base --is-ancestor efdeb6651f3614735d50629cdaabcf7e29c22de2 "$GITHUB_SHA"
          test -f docs/protocols/NEU-01-G08-P01-FIXED-GRID-SINGLE-PAIR-2026-11-12.md
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared project dependencies and tests
        run: python -m pip install -e '.[dev]'
      - name: Run synthetic gates before source access
        run: python -m pytest -q tests/test_neu01_g08_fixed_pair.py
      - name: Run G08 original source metadata, conditionally fixed-grid comparison
        run: python -m experiments.neu01_g08_fixed_pair
      - name: SHA256 original aggregate only
        if: always()
        run: |
          if [ -f docs/results/NEU-01-G08-P01-first-run/audit.json ]; then
            sha256sum docs/results/NEU-01-G08-P01-first-run/audit.json
          fi
      - name: Preserve aggregate-only source outcome; never EEG signals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neu01-g08-first-fixed-pair-grid-audit-only
          path: docs/results/NEU-01-G08-P01-first-run/audit.json
          if-no-files-found: warn
          retention-days: 90
