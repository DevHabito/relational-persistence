name: NEU-01-G08-D02 Post-Result Shared Gain Residual Census

on:
  push:
    branches:
      - audit/neu01-g08-d02-reference-residual-20261112
    paths:
      - .github/workflows/neu01-g08-d02-global-residual.yml
      - experiments/neu01_g08_d02_global_residual.py
      - tests/test_neu01_g08_d02_global_residual.py

permissions:
  contents: read

concurrency:
  group: neu01-g08-d02-first-source-residual
  cancel-in-progress: false

jobs:
  residual_census:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout immutable G08 and G05 original archives
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check dated protocol-only commit preceded implementation
        run: |
          git merge-base --is-ancestor a5f5dd11d8ed95d618ca718bb7b9eec9ea32664a "$GITHUB_SHA"
          test -f docs/protocols/NEU-01-G08-D02-SHARED-GAIN-RESIDUAL-2026-11-12.md
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and declared test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Pre-source independent and adversarial synthetic tests
        run: python -m pytest -q tests/test_neu01_g08_d02_global_residual.py
      - name: Original fixed single-pair residual and native equality source census
        run: python -m experiments.neu01_g08_d02_global_residual
      - name: Hash original source result
        if: always()
        run: |
          if [ -f docs/results/NEU-01-G08-D02-first-run/audit.json ]; then
            sha256sum docs/results/NEU-01-G08-D02-first-run/audit.json
          fi
      - name: Preserve aggregate-only first result, never EEG values
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neu01-g08-d02-first-global-residual-aggregates-only
          path: docs/results/NEU-01-G08-D02-first-run/audit.json
          if-no-files-found: warn
          retention-days: 90
