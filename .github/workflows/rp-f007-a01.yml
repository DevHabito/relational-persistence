name: RP-F007-A01 Original Synthetic Hard-Cap Certificate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rp-f007-a01.yml
      - experiments/rp_f007_residual_bounds.py
      - tests/test_rp_f007_residual_bounds.py
      - RelationalPersistence/ResidualBounds.lean

permissions:
  contents: read

concurrency:
  group: rp-f007-a01-first-original
  cancel-in-progress: false

jobs:
  first_hard_cap_synthetic_certificate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refuse replacement of original RP-F007-A01 first run
        run: |
          if test -e docs/results/RP-F007-A01-first-run; then
            echo "First RP-F007-A01 result already exists; no replay may replace it."
            exit 1
          fi
      - name: Install fixed Python test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Independently check all registered adversarial controls
        run: python -m pytest -q tests/test_rp_f007_residual_bounds.py
      - name: Write once the original EXACT synthetic report
        run: |
          python -m experiments.rp_f007_residual_bounds \
            --output rp-f007-original/RP-F007-A01.json
      - name: Preserve original proof report as temporary Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rp-f007-a01-first-synthetic-certificate
          path: rp-f007-original/RP-F007-A01.json
          retention-days: 90
          if-no-files-found: warn
      - name: Archive original bytes and decision whether verified or invalid
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          first="rp-f007-original/RP-F007-A01.json"
          archive="docs/results/RP-F007-A01-first-run"
          if test -e "$archive"; then
            echo "Original archive exists: refusing overwrite."
            exit 1
          fi
          if ! test -f "$first"; then
            echo "No original certificate exists; cannot invent source evidence." >&2
            exit 1
          fi
          mkdir -p "$archive"
          cp "$first" "$archive/audit.json"
          python - <<'PY'
          import json
          from hashlib import sha256
          from pathlib import Path

          root = Path("docs/results/RP-F007-A01-first-run")
          data = (root / "audit.json").read_bytes()
          report = json.loads(data)
          manifest = {
              "protocol": "RP-F007-A01",
              "first_run_id": "${{ github.run_id }}",
              "first_code_commit": "${{ github.sha }}",
              "original_decision": report["decision"],
              "original_report_sha256": sha256(data).hexdigest(),
              "preregistration_commit": "93d5dc4f2c99b663bfede40d515c2dc37bc14e14",
              "external_dataset_downloaded": False,
              "existing_first_runs_modified": False,
              "new_physical_law_claimed": False,
          }
          (root / "archive-index.json").write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          git add "$archive"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "data(provenance): freeze first RP-F007 hard-cap residual certificate"
          git push origin HEAD:main
