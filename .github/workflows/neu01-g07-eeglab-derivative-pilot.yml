name: NEU-01-G07 First Original EEGLAB Derivative Metadata Pilot

on:
  push:
    branches:
      - research/neu01-g07-eeglab-derivative-pilot-20261112
    paths:
      - .github/workflows/neu01-g07-eeglab-derivative-pilot.yml
      - experiments/neu01_g07_eeglab_pilot.py
      - tests/test_neu01_g07_eeglab_pilot.py

permissions:
  contents: read

concurrency:
  group: neu01-g07-first-original-authenticated-derivative
  cancel-in-progress: false

jobs:
  single_original_derivative_pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout frozen source and full protocol history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable protocol alone before this implementation
        run: |
          git merge-base --is-ancestor 6a0e0bd96fd5c8f4d4823c7c02fec0128c8c9d6e "$GITHUB_SHA"
          test -f docs/protocols/NEU-01-G07-P01-EEGLAB-DERIVATIVE-PILOT-2026-11-12.md
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install publisher metadata reader and adversarial test runner
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.11,<2' 'pytest>=7,<10'
      - name: Synthetic and adversarial pre-source gates
        run: python -m pytest -q tests/test_neu01_g07_eeglab_pilot.py
      - name: Authenticate ONE original derivative and inspect only metadata
        run: python -m experiments.neu01_g07_eeglab_pilot
      - name: Freeze exact first-run aggregate checksum
        if: always()
        run: |
          if [ -f docs/results/NEU-01-G07-P01-first-run/audit.json ]; then
            sha256sum docs/results/NEU-01-G07-P01-first-run/audit.json
          fi
      - name: Retain original metadata-only audit, never the actual EEG file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neu01-g07-first-derivative-metadata-only
          path: docs/results/NEU-01-G07-P01-first-run/audit.json
          if-no-files-found: warn
          retention-days: 90
