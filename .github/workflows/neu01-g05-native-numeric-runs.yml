name: NEU-01-G05 Numeric Run Forensics

on:
  push:
    branches:
      - research/neu01-g05-numeric-repetition-forensics-20261112
    paths:
      - .github/workflows/neu01-g05-native-numeric-runs.yml
      - experiments/neu01_g05_numeric_runs.py
      - tests/test_neu01_g05_numeric_runs.py

permissions:
  contents: read

concurrency:
  group: neu01-g05-source-first-numeric-census
  cancel-in-progress: false

jobs:
  first_numeric_census:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source and full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check protocol-only commit predates implementation
        run: |
          git merge-base --is-ancestor 1702cbb602d35efe8a4bc3cdc484f2ad2e5f9f7a "$GITHUB_SHA"
          test -f docs/protocols/NEU-01-G05-P01-NUMERIC-REPETITION-2026-11-12.md
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared research test and analysis dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run synthetic G05 and adversarial checks BEFORE source access
        run: python -m pytest -q tests/test_neu01_g05_numeric_runs.py
      - name: Authenticate and analyze six original processed EEG records
        run: python -m experiments.neu01_g05_numeric_runs
      - name: Hash the exact original aggregate
        if: always()
        run: |
          if [ -f docs/results/NEU-01-G05-P01-first-run/audit.json ]; then
            sha256sum docs/results/NEU-01-G05-P01-first-run/audit.json
          fi
      - name: Store only anonymized aggregate counts and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neu01-g05-first-native-run-aggregates
          path: docs/results/NEU-01-G05-P01-first-run/audit.json
          if-no-files-found: warn
          retention-days: 90
